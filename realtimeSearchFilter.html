<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Placeholder styles for your custom card classes */
        .card {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            color: white;
        }

        .bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

  

        .content {
            position: relative;
            z-index: 3;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
        }
    </style>
</head>

<body class="bg-[#222] min-h-screen p-10">
    <div class="flex flex-col gap-10 items-center">

        <input class="px-5 py-5 rounded outline-none bg-[#111] text-[#888] w-full max-w-md" type="text"
            placeholder="Search...">

        <div class="flex gap-10">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80"
                    class="bg-img" alt="User Profile" />

                <div class="blurred-layer"></div>

                <div class="content">
                    <h3 class="text-xl font-bold">User 123</h3>
                    <p class="text-sm text-gray-200">Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit,
                        quis.</p>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
